name: CI

on:
  push:
    branches: [main, master, "claude/*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # ─── Type checking ─────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install backend dependencies
        run: npm ci

      - name: Type-check backend
        run: npx tsc --noEmit

      - name: Install frontend dependencies
        run: cd site && npm ci

      - name: Type-check frontend
        run: cd site && npx tsc --noEmit

  # ─── Backend unit + integration tests ─────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test
        env:
          DATABASE_URL: ":memory:"
          NODE_ENV: test
          JWT_SECRET: "ci-test-secret-that-is-long-enough-64chars-padding"
          REDIS_URL: "redis://localhost:6379"

  # ─── Frontend component tests ──────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install frontend dependencies
        run: cd site && npm ci

      - name: Run frontend tests
        run: cd site && npm test

  # ─── Python worker tests ───────────────────────────────────────────────────
  # Fast, dependency-free: the runners' pure helpers (config building, prompt
  # shaping, detector scoring, the SSRF guard) are unit-tested with the stdlib,
  # and each Dockerfile is validated to build. The heavy tool images (garak's
  # Rust + ML stack, etc.) are NOT built here — that would add 20+ min per run.
  test-workers:
    name: Python Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hard gate: the unit tests import the garak/pyrit runners and py_compile
      # the deepteam runner, so any syntax or logic drift in the worker code
      # fails CI here.
      - name: Run worker unit tests
        run: python -m unittest discover -s python-workers/tests -p "test_*.py" -v

      # Non-blocking signal: validate each worker Dockerfile without a full
      # build (the heavy tool images — garak's Rust + ML stack — take 20+ min
      # and are network-flaky, so they are not built on every push). Surfaced
      # in the logs; does not gate the merge.
      - name: Lint worker Dockerfiles
        continue-on-error: true
        run: |
          for tool in garak pyrit deepteam; do
            echo "── checking python-workers/$tool/Dockerfile ──"
            docker build --check "python-workers/$tool" || echo "::warning::Dockerfile check reported issues for $tool"
          done

  # ─── Live-model smoke (real target + judge) ────────────────────────────────
  # Validates the real target-call + AI-judge path against live models. It
  # SKIPS cleanly (exit 0) unless the ANTHROPIC_API_KEY secret and the
  # LIVE_SMOKE_TARGET_* variables are configured, so it is safe to run always
  # and only exercises real models where a maintainer opts in with secrets.
  live-smoke:
    name: Live-Model Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Run live-model smoke (skips without secrets)
        run: node scripts/live-smoke.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.LIVE_SMOKE_JUDGE_MODEL }}
          LIVE_SMOKE_TARGET_URL: ${{ vars.LIVE_SMOKE_TARGET_URL }}
          LIVE_SMOKE_TARGET_TYPE: ${{ vars.LIVE_SMOKE_TARGET_TYPE }}
          LIVE_SMOKE_TARGET_MODEL: ${{ vars.LIVE_SMOKE_TARGET_MODEL }}
          LIVE_SMOKE_TARGET_KEY: ${{ secrets.LIVE_SMOKE_TARGET_KEY }}

  # ─── Build verification ────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install all dependencies
        run: npm ci && cd site && npm ci

      - name: Build backend + frontend
        run: npm run build:all

      - name: Verify dist output
        run: |
          test -f dist/server/app.js || (echo "Backend build missing dist/server/app.js" && exit 1)
          test -f site/dist/index.html || (echo "Frontend build missing site/dist/index.html" && exit 1)
          echo "Build artifacts verified ✓"
